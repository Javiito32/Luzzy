# Genera Luzzy.xcodeproj con: xcodegen generate
# https://github.com/yonaskolb/XcodeGen
name: Luzzy

options:
  bundleIdPrefix: app.luzzy
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: es
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    # Pon aquí tu Team ID de Apple Developer (o configúralo en Xcode).
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
    DEAD_CODE_STRIPPING: YES

packages:
  LuzzyKit:
    path: Packages/LuzzyKit

targets:
  Luzzy:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - "**/*.md"
          - "Resources/Luzzy.storekit"
      - path: App/Resources/Luzzy.storekit
        buildPhase: none
    dependencies:
      - package: LuzzyKit
        product: LuzzyCore
      - package: LuzzyKit
        product: LuzzySecurity
      - package: LuzzyKit
        product: FireflyAPI
      - package: LuzzyKit
        product: LuzzyPersistence
      - package: LuzzyKit
        product: LuzzyStore
      - package: LuzzyKit
        product: LuzzyUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.luzzy.ios
        PRODUCT_NAME: Luzzy
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/Luzzy.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
    scheme:
      storeKitConfiguration: App/Resources/Luzzy.storekit
      testTargets: []
